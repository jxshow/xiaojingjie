<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鲸洁 · 磁盘清理助手</title><link rel="stylesheet" href="/desk.css"></head>
<body><a class="skip-link" href="#workbench">跳到清理工作台</a>
<header class="mast"><div class="mastinner"><a class="brand" href="#overview" aria-label="小鲸洁首页"><i class="mark" aria-hidden="true"><i></i></i><b>小鲸洁</b></a><span class="brand-desc">磁盘清理助手</span><nav class="pages" aria-label="页面导航"><a href="#overview" aria-current="location">空间总览</a><a href="#workbench">清理工作台</a></nav><span id="connection" class="connection">正在连接</span></div></header>
<main class="canvas"><section id="overview" aria-labelledby="overview-title">
<div class="sectionhead"><div><h1 id="overview-title">空间总览</h1><p id="scan-meta">正在读取扫描结果…</p></div><button id="rescan" class="refresh" disabled><span aria-hidden="true">↻</span> 重新扫描</button></div>
<div class="hero-grid"><article class="hero"><div class="hero-art" aria-hidden="true"></div><div class="hero-copy"><div class="disk-chip"><i></i><span id="hero-drive">磁盘空间</span></div><h2 id="hero-status">正在分析磁盘</h2><div class="reading"><strong id="hero-number">—</strong><span id="hero-unit"></span></div><p id="hero-caption">正在读取可用容量</p></div></article>
<article class="advice"><div class="advice-top"><span class="spark" aria-hidden="true">✦</span><h2>本轮清理建议</h2></div><p class="advice-copy" id="advice-copy">扫描完成后在这里查看优先处理的项目。</p><div class="opportunity"><b id="opportunity">—</b><span id="opportunity-label">可清理缓存</span></div><button id="jump-safe" class="primary action" disabled>查看可清理项 <span aria-hidden="true">→</span></button></article></div>
<div class="report-grid"><section class="panel capacity"><div class="panelhead"><h2>磁盘使用情况</h2><span id="drive-count" class="small"></span></div><div id="drives"></div><div class="legend"><span><i class="used"></i>其他已用</span><span><i class="cache"></i>缓存候选</span><span><i class="free"></i>可用空间</span></div><p class="drive-insight" id="drive-insight" hidden></p></section>
<section class="panel ranking"><div class="panelhead"><h2>占用排行 <small>TOP 5</small></h2><span id="rank-source" class="small"></span></div><div id="ranks"></div><p id="rank-note" class="rank-note"></p></section></div></section>
<section id="workbench" aria-labelledby="work-title"><div class="sectionhead"><div><h2 id="work-title">清理工作台</h2><p id="intro">勾选清理项，预览后执行。</p></div></div><div id="notice" role="status"></div>
<div class="work-grid"><div class="listpanel"><nav id="filters" aria-label="筛选候选项"></nav><h2 id="title" class="sr">清理清单</h2><div id="rows"></div><section id="receipt"></section></div>
<aside class="side"><div class="panelhead"><h2>执行进度</h2></div><div class="meter"><div class="orb" id="orb" role="img" aria-label="处理进度"><div class="fill"></div><div class="orbtext"><b id="percent">—</b><small id="orbHint">等待扫描</small></div></div><div id="progress" role="status"></div></div><div class="summary"><dl><dt>待执行操作</dt><dd id="chosen">0 项</dd><dt>预计清除缓存</dt><dd id="bytes">0 B</dd></dl><button id="preview" class="primary" disabled>预览所选操作</button></div></aside></div></section></main>
<dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title">确认本次操作</h2><p id="warning"></p><div id="plan"></div><div class="buttons"><button id="cancel">返回修改</button><button id="confirm" class="primary">确认执行</button></div></dialog>
<script src="/overview.js"></script><script src="/desk.js"></script></body></html>
